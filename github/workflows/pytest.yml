name: Run Pytest for Playwright

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          playwright install

      - name: Run Pytest
        run: |
          mkdir -p screenshots
          pytest tests --html=report.html --self-contained-html || true  # don't fail workflow on first error to capture screenshots

      - name: Upload HTML report
        uses: actions/upload-artifact@v3
        with:
          name: pytest-report
          path: report.html

      - name: Upload Screenshots
        uses: actions/upload-artifact@v3
        with:
          name: screenshots
          path: screenshots/